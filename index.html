<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Ramani — Explore</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#app{margin:0;width:100%;height:100%;font-family:Roboto,Arial,sans-serif;overflow:hidden}
#app{position:relative;background:#111}
#map{position:absolute;inset:0;background:#222}

/* ---- top search ---- */
.searchWrap{position:absolute;z-index:1000;top:10px;left:10px;right:10px}
.searchBar{display:flex;align-items:center;background:#fff;border-radius:26px;box-shadow:0 2px 8px rgba(0,0,0,.35);padding:6px 14px;height:48px;gap:10px}
.pinIcon{width:22px;height:22px;flex:none;border-radius:50%;background:conic-gradient(from 180deg,#20c997,#4dabf7,#f06595,#ffa94d,#20c997);display:flex;align-items:center;justify-content:center;font-size:12px}
.searchBar input{flex:1;border:0;outline:0;font-size:15px;color:#202124;background:transparent;height:100%;min-width:0}
.searchBar input::placeholder{color:#80868b}
.searchBar .mic{font-size:17px;color:#4285f4;flex:none}
.avatar{width:30px;height:30px;border-radius:50%;background:#5f6368;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex:none}

.suggestions{margin-top:6px;background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.35);overflow:hidden;max-height:0;transition:max-height .15s ease}
.suggestions.open{max-height:300px;overflow-y:auto}
.sugItem{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;border-bottom:1px solid #f1f3f4;font-size:14px;color:#202124}
.sugItem:last-child{border-bottom:0}
.sugItem:hover{background:#f1f3f4}
.sugItem small{display:block;color:#5f6368;font-size:11px;margin-top:1px}

.chips{position:absolute;z-index:1000;top:66px;left:10px;right:10px;display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;background:#fff;border-radius:20px;padding:9px 14px;font-size:13px;font-weight:600;color:#3c4043;box-shadow:0 1px 4px rgba(0,0,0,.3);white-space:nowrap;cursor:pointer;border:1.5px solid transparent}
.chip.active{color:#0b57d0;border-color:#0b57d0;background:#e8f0fe}

/* ---- right rail FABs ---- */
.fabCol{position:absolute;z-index:1000;right:10px;bottom:150px;display:flex;flex-direction:column;gap:12px;align-items:flex-end}
.fab{width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;border:0;color:#3c4043}
.fab.teal{background:#0e8a7d;color:#fff}
.fabDirections{width:44px;height:44px;border-radius:12px;background:#0b8f8f;color:#fff;box-shadow:0 1px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:20px;transform:rotate(45deg);cursor:pointer;border:0}
.fabDirections span{transform:rotate(-45deg);display:block}

.layerPanel{position:absolute;z-index:1001;right:10px;bottom:210px;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.35);padding:8px;display:none;gap:8px}
.layerPanel.open{display:flex}
.layerOpt{width:60px;text-align:center;cursor:pointer;font-size:10px;color:#3c4043;font-weight:600}
.layerOpt .sw{width:60px;height:44px;border-radius:8px;border:2px solid transparent;margin-bottom:4px;background-size:cover;background-position:center}
.layerOpt.active .sw{border-color:#0b57d0}
.satSwatch{background:linear-gradient(135deg,#6b5b3f,#8a7550)}
.streetSwatch{background:linear-gradient(135deg,#dfe7ee,#c8d6e0)}

/* ---- bottom sheet ---- */
.sheet{position:absolute;z-index:1000;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -2px 14px rgba(0,0,0,.3);transform:translateY(calc(100% - 78px));transition:transform .25s ease;max-height:60%;overflow:hidden}
.sheet.expanded{transform:translateY(0);overflow-y:auto}
.sheetHandle{width:36px;height:4px;background:#dadce0;border-radius:2px;margin:8px auto 6px;cursor:pointer}
.sheetHead{display:flex;justify-content:space-between;align-items:center;padding:0 20px 10px}
.sheetHead h2{margin:0;font-size:20px;color:#202124;font-weight:500}
.weatherChip{display:flex;align-items:center;gap:6px;background:#f1f3f4;border-radius:16px;padding:6px 12px;font-size:14px;font-weight:600;color:#202124}
.sheetBody{padding:0 20px 20px}
.sheetTitle{font-size:16px;font-weight:600;color:#202124;display:flex;justify-content:space-between;gap:8px}
.sheetSub{font-size:13px;color:#5f6368;margin-top:2px}
.sheetActions{display:flex;gap:8px;margin-top:14px}
.sheetActions button{flex:1;border:0;border-radius:20px;padding:10px 12px;font-weight:600;font-size:13px;cursor:pointer}
.btnPrimary{background:#0b57d0;color:#fff}
.btnGhost{background:#f1f3f4;color:#0b57d0}

/* ---- bottom nav ---- */
.bottomNav{position:absolute;z-index:1000;left:0;right:0;bottom:0;background:#f8f9fa;display:flex;justify-content:space-around;padding:10px 0 6px;font-size:11px;color:#5f6368;transform:translateY(100%);transition:transform .25s ease}
.bottomNav.show{transform:translateY(0)}
.navItem{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.navItem.active{color:#0e8a7d;font-weight:700}
.navItem .ic{font-size:19px}

.toast{position:absolute;z-index:1200;left:12px;right:12px;bottom:210px;max-width:420px;margin:auto;background:#202124;color:#fff;font-size:12px;padding:10px 14px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.3);pointer-events:none;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}

.netChip{position:absolute;z-index:1000;top:118px;right:10px;background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.3);padding:4px 9px;font-size:10px;font-weight:700}
.netChip.ok{color:#137333}.netChip.bad{color:#c5221f}

.leaflet-control-attribution{font-size:9px}

/* blue dot */
.meDotWrap{position:relative;width:16px;height:16px}
.meDot{width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.35),0 1px 4px rgba(0,0,0,.4)}
.mePulse{position:absolute;top:50%;left:50%;width:16px;height:16px;background:rgba(26,115,232,.35);border-radius:50%;transform:translate(-50%,-50%);animation:pulse 2s infinite}
@keyframes pulse{0%{transform:translate(-50%,-50%) scale(1);opacity:.7}100%{transform:translate(-50%,-50%) scale(3.2);opacity:0}}

/* poi pin */
.poiPin{width:30px;height:30px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.poiLabel{background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
<div id="map"></div>

<div class="searchWrap">
  <div class="searchBar">
    <div class="pinIcon">📍</div>
    <input id="q" placeholder="Tafuta hapa, mfano vituo vya mafuta" autocomplete="off">
    <div class="mic" onclick="showToast('🎙️ Sauti si hai kwenye demo hii.')">🎙️</div>
    <div class="avatar">👤</div>
  </div>
  <div class="suggestions" id="suggestions"></div>
</div>

<div class="chips" id="chips">
  <div class="chip active" data-cat="all">🔍 Ona Zote</div>
  <div class="chip" data-cat="fuel">⛽ Mafuta</div>
  <div class="chip" data-cat="restaurant">🍴 Migahawa</div>
  <div class="chip" data-cat="hotel">🛏️ Hoteli</div>
  <div class="chip" data-cat="bar">🍸 Baa</div>
  <div class="chip" data-cat="school">🎓 Shule</div>
  <div class="chip" data-cat="market">🛒 Masoko</div>
  <div class="chip" data-cat="atm">🏧 ATM</div>
</div>

<div class="netChip ok" id="net">● Online</div>

<div class="layerPanel" id="layerPanel">
  <div class="layerOpt active" data-layer="sat" onclick="setLayer('sat')"><div class="sw satSwatch"></div>Setalaiti</div>
  <div class="layerOpt" data-layer="street" onclick="setLayer('street')"><div class="sw streetSwatch"></div>Ramani</div>
</div>

<div class="fabCol">
  <button class="fab teal" onclick="toggleLayerPanel()">🗂️</button>
  <button class="fab" id="locateBtn" onclick="locate()">🧭</button>
</div>
<div class="fabDirections" style="position:absolute;z-index:1000;right:14px;bottom:96px" onclick="openDirections()"><span>➜</span></div>

<div class="sheet" id="sheet">
  <div class="sheetHandle" onclick="toggleSheet()"></div>
  <div class="sheetHead">
    <h2 id="areaName">Inatafuta…</h2>
    <div class="weatherChip" id="weatherChip">…</div>
  </div>
  <div class="sheetBody" id="sheetBody" style="display:none">
    <div class="sheetTitle"><span id="sheetTitle">—</span></div>
    <div class="sheetSub" id="sheetSub"></div>
    <div class="sheetActions">
      <button class="btnPrimary" id="actionMain">🧭 Elekeza</button>
      <button class="btnGhost" onclick="copyCoords()">📋 Nakili</button>
    </div>
  </div>
</div>

<div class="bottomNav show" id="bottomNav">
  <div class="navItem active"><span class="ic">📍</span>Explore</div>
  <div class="navItem"><span class="ic">🔖</span>You</div>
  <div class="navItem"><span class="ic">➕</span>Contribute</div>
</div>

<div class="toast" id="toast"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const map = L.map('map', {zoomControl:false, attributionControl:true}).setView([-6.173, 35.742], 14);

const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:19, attribution:'Tiles &copy; Esri'});
const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'});
satLayer.addTo(map);
let currentLayer = 'sat';

function setLayer(kind){
  if(kind !== currentLayer){
    if(kind==='street'){ map.removeLayer(satLayer); streetLayer.addTo(map); }
    else { map.removeLayer(streetLayer); satLayer.addTo(map); }
    currentLayer = kind;
    document.querySelectorAll('.layerOpt').forEach(el=>el.classList.toggle('active', el.dataset.layer===kind));
  }
  toggleLayerPanel();
}
function toggleLayerPanel(){ document.getElementById('layerPanel').classList.toggle('open'); }

function showToast(t){
  const el = document.getElementById('toast');
  el.innerHTML = t; el.classList.add('show');
  clearTimeout(showToast._t); showToast._t = setTimeout(()=>el.classList.remove('show'), 3000);
}

/* ---------------- Bottom sheet ---------------- */
const sheet = document.getElementById('sheet');
function toggleSheet(){ sheet.classList.toggle('expanded'); }
function expandSheetFor(title, sub, actionLabel, actionFn){
  document.getElementById('sheetBody').style.display = 'block';
  document.getElementById('sheetTitle').textContent = title;
  document.getElementById('sheetSub').textContent = sub;
  const btn = document.getElementById('actionMain');
  btn.textContent = actionLabel; btn.onclick = actionFn;
  sheet.classList.add('expanded');
}

let lastPlace = null;
function copyCoords(){
  if(!lastPlace) return;
  navigator.clipboard?.writeText(lastPlace.lat+', '+lastPlace.lon)
    .then(()=>showToast('📋 Coordinates zimenakiliwa.'))
    .catch(()=>showToast('⚠️ Imeshindikana kunakili.'));
}
function openDirections(){
  if(lastPlace){ window.open('https://www.google.com/maps/dir/?api=1&destination='+lastPlace.lat+','+lastPlace.lon, '_blank'); }
  else { showToast('📍 Chagua mahali kwanza (bonyeza kwenye ramani au tafuta).'); }
}

/* ---------------- Area name + weather (updates as you pan) ---------------- */
let areaTimer = null;
map.on('moveend', ()=>{ clearTimeout(areaTimer); areaTimer = setTimeout(updateAreaAndWeather, 600); loadPOIs(); });

async function updateAreaAndWeather(){
  const c = map.getCenter();
  if(navigator.onLine){
    try{
      const r = await fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+c.lat+'&lon='+c.lng+'&zoom=10');
      const d = await r.json();
      const name = d?.address?.city || d?.address?.town || d?.address?.county || d?.address?.state || d?.display_name?.split(',')[0] || '—';
      document.getElementById('areaName').textContent = name;
    }catch(e){}
    try{
      const w = await fetch('https://api.open-meteo.com/v1/forecast?latitude='+c.lat+'&longitude='+c.lng+'&current=temperature_2m,is_day');
      const wd = await w.json();
      const t = Math.round(wd.current.temperature_2m);
      const icon = wd.current.is_day ? '☀️' : '🌙';
      document.getElementById('weatherChip').innerHTML = icon+' '+t+'°';
    }catch(e){ document.getElementById('weatherChip').textContent=''; }
  }
}
updateAreaAndWeather();

/* ---------------- Search suggestions ---------------- */
const qInput = document.getElementById('q');
const sugBox = document.getElementById('suggestions');
let searchTimer=null, currentResults=[];
qInput.addEventListener('input', ()=>{
  clearTimeout(searchTimer);
  const v = qInput.value.trim();
  if(!v){ sugBox.classList.remove('open'); sugBox.innerHTML=''; return; }
  searchTimer = setTimeout(()=>runSearch(v), 350);
});
qInput.addEventListener('keydown', e=>{ if(e.key==='Enter' && currentResults[0]) pickResult(currentResults[0]); });

async function runSearch(q){
  if(!navigator.onLine){ showToast('⚠️ Offline: search inahitaji intaneti.'); return; }
  try{
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&addressdetails=1&q='+encodeURIComponent(q));
    currentResults = await r.json();
    renderSuggestions();
  }catch(e){}
}
function renderSuggestions(){
  if(!currentResults.length){ sugBox.classList.remove('open'); sugBox.innerHTML=''; return; }
  sugBox.innerHTML = currentResults.map((r,i)=>{
    const main = r.display_name.split(',')[0];
    return '<div class="sugItem" data-i="'+i+'">📍 <span>'+main+'<small>'+r.display_name+'</small></span></div>';
  }).join('');
  sugBox.classList.add('open');
  sugBox.querySelectorAll('.sugItem').forEach(el=> el.addEventListener('click', ()=>pickResult(currentResults[+el.dataset.i])) );
}
function pickResult(r){
  const lat=+r.lat, lon=+r.lon;
  map.setView([lat,lon], 16);
  dropPin(lat, lon, r.display_name.split(',')[0], r.display_name);
  qInput.value = r.display_name.split(',')[0];
  sugBox.classList.remove('open'); sugBox.innerHTML=''; qInput.blur();
}

let pinMarker = null;
function dropPin(lat, lon, title, sub){
  if(pinMarker) pinMarker.setLatLng([lat,lon]);
  else pinMarker = L.marker([lat,lon], {icon:L.divIcon({className:'',html:'<div class="poiPin" style="background:#0e8a7d">🔖</div>',iconSize:[30,30],iconAnchor:[15,28]})}).addTo(map);
  lastPlace = {lat, lon};
  expandSheetFor(title, sub || (lat.toFixed(5)+', '+lon.toFixed(5)), '🧭 Elekeza', openDirections);
}
map.on('click', e=> dropPin(e.latlng.lat, e.latlng.lng, 'Pini iliyowekwa', null) );

/* ---------------- Category chips ---------------- */
let activeCat = 'all';
document.getElementById('chips').addEventListener('click', e=>{
  const chip = e.target.closest('.chip'); if(!chip) return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  activeCat = chip.dataset.cat;
  loadPOIs();
});

/* ---------------- Live POIs via Overpass ---------------- */
const CATS = {
  fuel:      {q:'amenity=fuel',        color:'#ff8a00', icon:'⛽'},
  restaurant:{q:'amenity=restaurant',  color:'#ff8a00', icon:'🍴'},
  hotel:     {q:'tourism=hotel',       color:'#e8398a', icon:'🛏️'},
  bar:       {q:'amenity=bar',         color:'#ff8a00', icon:'🍸'},
  school:    {q:'amenity=school',      color:'#6c7075', icon:'🎓'},
  market:    {q:'shop=supermarket',    color:'#1a73e8', icon:'🛒'},
  atm:       {q:'amenity=atm',         color:'#1a73e8', icon:'🏧'}
};

let poiLayer = L.layerGroup().addTo(map);
let poiTimer = null;
function loadPOIs(){
  clearTimeout(poiTimer);
  poiTimer = setTimeout(fetchPOIs, 500);
}
async function fetchPOIs(){
  if(!navigator.onLine) return;
  if(map.getZoom() < 13){ poiLayer.clearLayers(); return; }
  const b = map.getBounds();
  const bbox = b.getSouth()+','+b.getWest()+','+b.getNorth()+','+b.getEast();
  const cats = activeCat==='all' ? Object.keys(CATS) : [activeCat];
  const filters = cats.map(c=>'node['+CATS[c].q.replace('=','="')+'"]('+bbox+');').join('');
  const query = '[out:json][timeout:15];('+filters+');out center 60;';
  try{
    const r = await fetch('https://overpass-api.de/api/interpreter', {method:'POST', body:query});
    const d = await r.json();
    poiLayer.clearLayers();
    (d.elements||[]).forEach(el=>{
      const cat = cats.find(c=>{
        const [k,v] = CATS[c].q.split('=');
        return el.tags && el.tags[k] === v;
      }) || cats[0];
      const meta = CATS[cat];
      const name = el.tags?.name || meta.icon;
      const marker = L.marker([el.lat, el.lon], {
        icon: L.divIcon({className:'', html:'<div class="poiPin" style="background:'+meta.color+'">'+meta.icon+'</div>', iconSize:[30,30], iconAnchor:[15,28]})
      });
      marker.on('click', ()=> dropPin(el.lat, el.lon, el.tags?.name || meta.icon+' Sehemu', el.tags?.['addr:full']||null) );
      marker.addTo(poiLayer);
    });
  }catch(e){ /* overpass may rate-limit; fail silently like a real app retry */ }
}
loadPOIs();

/* ---------------- GPS blue dot ---------------- */
let meMarker=null, accCircle=null, watch=null, last=null;
function locate(){
  if(!navigator.geolocation){ showToast('⚠️ Browser hii haisapoti GPS.'); return; }
  if(watch!==null){ if(last) map.setView([last.coords.latitude,last.coords.longitude], Math.max(map.getZoom(),16)); return; }
  watch = navigator.geolocation.watchPosition(p=>{
    last=p; const c=p.coords;
    if(!meMarker){
      meMarker = L.marker([c.latitude,c.longitude], {icon:L.divIcon({className:'',html:'<div class="meDotWrap"><div class="mePulse"></div><div class="meDot"></div></div>',iconSize:[16,16],iconAnchor:[8,8]}), zIndexOffset:1000}).addTo(map);
    } else meMarker.setLatLng([c.latitude,c.longitude]);
    if(!accCircle) accCircle = L.circle([c.latitude,c.longitude],{radius:c.accuracy,color:'#1a73e8',fillColor:'#1a73e8',fillOpacity:.12,weight:1}).addTo(map);
    else { accCircle.setLatLng([c.latitude,c.longitude]); accCircle.setRadius(c.accuracy); }
    map.setView([c.latitude,c.longitude], Math.max(map.getZoom(),16));
  }, e=>showToast('⚠️ '+({1:'Ruhusa ya GPS imekataliwa.',2:'Imeshindwa kupata GPS.',3:'GPS imechukua muda mrefu.'}[e.code]||'GPS error')),
  {enableHighAccuracy:true, maximumAge:2000, timeout:15000});
}

function network(){
  const n = document.getElementById('net');
  n.textContent = navigator.onLine ? '● Online' : '● Offline';
  n.className = 'netChip ' + (navigator.onLine?'ok':'bad');
}
addEventListener('online', network); addEventListener('offline', network); network();

document.addEventListener('click', e=>{ if(!e.target.closest('.searchWrap')){ sugBox.classList.remove('open'); } });
</script>
</body>
  </html>
