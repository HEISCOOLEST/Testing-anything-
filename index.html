<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROBNEY FARM — Farm Manager</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap');
:root{color-scheme:dark;--soil:#171510;--panel:#26231b;--g:#8fae45;--cream:#eee7d5;--muted:#aaa38f;--y:#d7a942;--r:#dc8977;--line:rgba(238,231,213,.1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:"DM Sans",system-ui,sans-serif;background:var(--soil);color:var(--cream);min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer}
h1,h2,h3,.num{font-family:"Space Grotesk","DM Sans",sans-serif}
.sb{width:230px;position:fixed;inset:0 auto 0 0;background:#13110d;border-right:1px solid var(--line);padding:24px 14px;z-index:20;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.logo{display:flex;gap:10px;align-items:center;margin-bottom:30px;padding:0 8px}
.lm{width:36px;height:36px;background:var(--g);color:#171510;display:grid;place-items:center;border-radius:11px 4px 11px 4px;font-weight:700}
.logo h2{font-size:16px}.logo small{color:var(--muted);font-size:10px;letter-spacing:1px;text-transform:uppercase}
.nav button{display:flex;gap:10px;width:100%;background:none;border:0;color:var(--muted);padding:11px 12px;border-radius:9px;font-size:13px;text-align:left;margin-bottom:3px}
.nav button:hover,.nav button.on{background:var(--panel);color:var(--cream)}.nav button.on{border-left:3px solid var(--g)}
main{margin-left:230px;padding:28px 34px;max-width:1200px}
.mm{display:none;background:var(--panel);color:var(--cream);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:16px}
.pg{display:none}.pg.on{display:block}
.eb{color:var(--g);font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:6px}
h1{font-size:clamp(26px,4vw,38px);letter-spacing:-1.5px;margin-bottom:22px}
.hero{border-radius:18px;padding:28px;margin-bottom:16px;border:1px solid var(--line);background:linear-gradient(90deg,rgba(21,19,14,.95),rgba(21,19,14,.6)),linear-gradient(135deg,#526b31,#181a12)}
.hero h2{font-size:26px;max-width:460px;line-height:1.1;letter-spacing:-.8px}.hero p{color:#c0b9a6;font-size:13px;margin:10px 0 18px;max-width:420px}
.pb,.sb2{border:0;border-radius:8px;padding:10px 14px;font-size:12px;font-weight:700;background:var(--g);color:#16160f}
.sb2{background:rgba(255,255,255,.08);color:var(--cream);border:1px solid var(--line);margin-left:6px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.st{border-left:4px solid var(--g);margin:0}.st small{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px}
.num{font-size:26px;margin:6px 0 2px}.st span{font-size:11px;color:#8c8778}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.card h3{font-size:15px;margin-bottom:14px}
.row{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.ic{width:34px;height:34px;border-radius:9px;background:#343025;display:grid;place-items:center;flex:none}
.row div{flex:1;min-width:0}.row strong{display:block;font-size:12px}.row small{color:var(--muted);font-size:10px}.row b{font-size:12px}
.pos{color:var(--g)}.neg{color:var(--r)}
.br{display:grid;grid-template-columns:90px 1fr 80px;gap:10px;align-items:center;margin-bottom:13px;font-size:11px}.br label{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.br b{text-align:right}
.pr{height:7px;background:#181711;border-radius:9px;overflow:hidden}.pr span{display:block;height:100%;background:var(--g)}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:20px}.ph h2{font-size:28px;letter-spacing:-1px}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.sum .card{margin:0;padding:14px}.sum small{color:var(--muted);font-size:10px;text-transform:uppercase}.sum strong{display:block;font-size:22px;margin-top:6px;font-family:"Space Grotesk",sans-serif}
.tb{display:flex;gap:10px;margin-bottom:12px}
input,select{background:#17160f;color:var(--cream);border:1px solid var(--line);padding:11px;border-radius:8px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--g)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:620px}
th{color:#777162;font-size:10px;text-transform:uppercase;letter-spacing:1px;text-align:left;padding:10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:12px}td select{padding:6px;font-size:11px;width:auto}
.x{background:none;border:1px solid var(--line);color:#9f8f83;padding:5px 8px;border-radius:6px;font-size:10px}.x:hover{color:var(--r);border-color:#8a5044}
.empty{text-align:center;padding:36px 10px;color:var(--muted);font-size:13px}
.tk{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.tk input{width:20px;height:20px;accent-color:var(--g);flex:none}.tk div{flex:1}.tk.d strong{text-decoration:line-through;color:var(--muted)}.tk small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;place-items:center;padding:16px}.md.on{display:grid}
.mb{width:min(480px,100%);max-height:90vh;overflow:auto;background:#252219;border:1px solid var(--line);border-radius:16px;padding:22px}
.mb h2{margin-bottom:16px}.fg{margin-bottom:12px}.fg label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px}
.ma{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.ch{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ch button{background:#17160f;color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:14px 8px;font-size:13px}.ch button:hover{border-color:var(--g)}
@media(max-width:1000px){.sb{transform:translateX(-100%);transition:.25s}.sb.on{transform:none}main{margin-left:0;padding:18px 16px}.mm{display:block}.grid4,.sum{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
</style></head><body>
<aside class="sb" id="sb"><div class="logo"><div class="lm">R</div><div><h2>ROBNEY FARM</h2><small>Farm Manager</small></div></div>
<nav class="nav" id="nav"></nav></aside>
<main><button class="mm" onclick="$('sb').classList.toggle('on')">☰ Menu</button><div id="pages"></div></main>
<div class="md" id="md"><div class="mb" id="mb"></div></div>
<script>
const $=id=>document.getElementById(id);
const p2=n=>String(n).padStart(2,'0');
const td=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const fmt=n=>Number(n||0).toLocaleString('en-US');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db={animals:[],eggs:[],sales:[],expenses:[],crops:[],tasks:[]};
try{const s=localStorage.getItem('robneyFarm2');if(s)Object.assign(db,JSON.parse(s));else{const o=JSON.parse(localStorage.getItem('robneyFarm')||'null');if(o&&o.animals)db.animals=o.animals.map(a=>({...a,vacc:a.vaccination,created:td()}))}}catch(e){}
const save=()=>{try{localStorage.setItem('robneyFarm2',JSON.stringify(db))}catch(e){}};
const sum=(a,f)=>a.reduce((s,x)=>s+Number(x[f]||0),0);
const mo=()=>td().slice(0,7);
const F={
animals:['Register animal',[['type','Type','select',['Chicken','Goat','Cow','Other']],['sex','Sex','select',['Female','Male']],['name','ID (auto-generated, you can edit)','text'],['breed','Breed','text'],['age','Age (e.g. 8 months)','text'],['health','Health','select',['Healthy','Observation','Sick']],['vacc','Vaccination','select',['Vaccinated','Not vaccinated']]]],
eggs:['Egg collection',[['date','Date','date'],['qty','Eggs collected','number'],['note','Note (optional)','text']]],
sales:['Record sale',[['date','Date','date'],['item','Item sold','text'],['qty','Quantity','number'],['amount','Total amount (TZS)','number'],['who','Customer (optional)','text']]],
expenses:['Record expense',[['date','Date','date'],['cat','Category','select',['Feed','Medicine','Labour','Seeds','Equipment','Transport','Other']],['desc','Description','text'],['amount','Amount (TZS)','number']]],
crops:['Add crop / field',[['name','Crop','text'],['field','Field','text'],['area','Area in acres (optional)','number'],['planted','Planting date','date'],['harvest','Expected harvest (optional)','date'],['stage','Stage','select',['Planned','Planted','Growing','Harvested']]]],
tasks:['Add task',[['title','Task','text'],['due','Due date (optional)','date']]]};
const OPT=['note','who','due','harvest','area'];
function openForm(k){const[t,f]=F[k];
$('mb').innerHTML=`<h2>${t}</h2>`+f.map(([n,l,ty,o])=>`<div class="fg"><label>${l}</label>`+(ty==='select'?`<select id="f_${n}">${o.map(x=>`<option>${x}</option>`).join('')}</select>`:`<input id="f_${n}" type="${ty}" ${ty==='number'?'min="0" step="any"':''} value="${ty==='date'&&!['harvest','due'].includes(n)?td():''}">`)+'</div>').join('')+`<div class="ma"><button class="sb2" onclick="closeM()">Cancel</button><button class="pb" onclick="submitF('${k}')">Save</button></div>`;
$('md').classList.add('on');
if(k==='animals'){let last=nextId($('f_type').value);$('f_name').value=last;$('f_type').onchange=()=>{if($('f_name').value===last||!$('f_name').value){last=nextId($('f_type').value);$('f_name').value=last}}}}
function nextId(type){const P={Chicken:'CH',Goat:'GT',Cow:'CW',Other:'OT'}[type]||'OT';let m=0;db.animals.forEach(a=>{const r=new RegExp('^'+P+'-(\\d+)$').exec(a.name);if(r)m=Math.max(m,+r[1])});return P+'-'+String(m+1).padStart(3,'0')}
function submitF(k){const o={id:Date.now().toString(),created:td()};
if(k==='animals'&&!$('f_name').value.trim())$('f_name').value=nextId($('f_type').value);
for(const[n,l,ty]of F[k][1]){let v=$('f_'+n).value.trim();if(!v&&!OPT.includes(n)){alert('Please fill in: '+l);return}
if(ty==='number'){v=Number(v||0);if(v<0||(!v&&!OPT.includes(n))){alert('Enter a valid number for: '+l);return}}o[n]=v}
if(k==='tasks')o.done=false;db[k].unshift(o);save();closeM();renderAll()}
function chooser(){$('mb').innerHTML=`<h2>Add record</h2><div class="ch"><button onclick="openForm('eggs')">🥚 Eggs</button><button onclick="openForm('sales')">💵 Sale</button><button onclick="openForm('expenses')">🌾 Expense</button><button onclick="openForm('crops')">🌱 Crop</button><button onclick="openForm('tasks')">◷ Task</button><button onclick="openForm('animals')">🐔 Animal</button></div><div class="ma"><button class="sb2" onclick="closeM()">Cancel</button></div>`;$('md').classList.add('on')}
const closeM=()=>$('md').classList.remove('on');
$('md').addEventListener('click',e=>{if(e.target.id==='md')closeM()});
function del(k,id){if(!confirm('Delete this record?'))return;db[k]=db[k].filter(x=>x.id!==id);save();renderAll()}
function upd(k,id,f,v){const x=db[k].find(a=>a.id===id);if(x){x[f]=v;save();renderAll()}}
const T=(h,rows,em)=>rows.length?`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`:`<div class="empty">${em}</div>`;
const X=(k,id)=>`<button class="x" onclick="del('${k}','${id}')">Delete</button>`;
const sel=(k,id,f,v,o)=>`<select onchange="upd('${k}','${id}','${f}',this.value)">${o.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`;
const S=(a)=>a.map(([l,v])=>`<div class="card"><small>${l}</small><strong>${v}</strong></div>`).join('');
const ph=(eb,h,k,lbl)=>`<div class="ph"><div><div class="eb">${eb}</div><h2>${h}</h2></div><button class="pb" onclick="openForm('${k}')">${lbl}</button></div>`;
const PG={
dash:`<div class="eb" id="dt"></div><h1 id="gr"></h1><div class="hero"><div class="eb">Farm snapshot</div><h2>The farm doesn't stop. Neither should your records.</h2><p>Animals, crops, money and daily jobs in one place. Data is saved on this device.</p><button class="pb" onclick="chooser()">+ Add record</button><button class="sb2" onclick="go('rep')">View report</button></div><div class="grid4" id="st"></div><div class="grid2"><div class="card"><h3>Recent activity</h3><div id="act"></div></div><div><div class="card"><h3>Farm health</h3><div id="hl"></div></div><div class="card"><h3>Open tasks</h3><div id="up"></div></div></div></div>`,
live:ph('Livestock','Your animals','animals','+ Add animal')+`<div class="sum" id="s-a"></div><div class="tb"><input id="q" placeholder="Search name or breed…" oninput="renderLive()"><select id="fl" onchange="renderLive()" style="max-width:160px"><option value="all">All</option><option>Chicken</option><option>Goat</option><option>Cow</option><option>Other</option></select></div><div class="card" id="t-a"></div><div class="ph"><h3 style="font-size:18px">Egg collection</h3><button class="pb" onclick="openForm('eggs')">+ Add eggs</button></div><div class="card" id="t-e"></div>`,
crops:ph('Crops & fields','Your crops','crops','+ Add crop')+`<div class="sum" id="s-c"></div><div class="card" id="t-c"></div>`,
sales:ph('Money in','Sales','sales','+ Record sale')+`<div class="sum" id="s-s"></div><div class="card" id="t-s"></div>`,
exp:ph('Money out','Expenses','expenses','+ Record expense')+`<div class="sum" id="s-x"></div><div class="card" id="t-x"></div>`,
tasks:ph('Daily work','Tasks & reminders','tasks','+ Add task')+`<div class="sum" id="s-t"></div><div class="card" id="t-t"></div>`,
rep:`<div class="ph"><div><div class="eb">Reports</div><h2>Farm report</h2></div><div><input type="month" id="rm" onchange="rep()"></div></div><div class="sum" id="s-r"></div><div class="grid2"><div class="card"><h3>Expenses by category</h3><div id="r1"></div></div><div class="card"><h3>Sales by item</h3><div id="r2"></div></div></div><div class="card"><h3>Last 6 months · sales (net profit on right)</h3><div id="r3"></div></div>`};
const NAV=[['dash','⌂','Overview'],['live','🐔','Livestock'],['crops','🌱','Crops & Fields'],['sales','💰','Sales'],['exp','↘','Expenses'],['tasks','◷','Tasks & Reminders'],['rep','▥','Reports']];
$('pages').innerHTML=Object.entries(PG).map(([k,h])=>`<section class="pg" id="p-${k}">${h}</section>`).join('');
$('nav').innerHTML=NAV.map(([k,i,l])=>`<button data-p="${k}" onclick="go('${k}')">${i} <span>${l}</span></button>`).join('');
$('rm').value=mo();
function go(p){document.querySelectorAll('.pg').forEach(e=>e.classList.toggle('on',e.id==='p-'+p));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));$('sb').classList.remove('on');window.scrollTo(0,0);if(p==='rep')rep()}
const inM=(a,m)=>a.filter(x=>(x.date||'').slice(0,7)===m);
function dash(){const h=new Date().getHours(),d=new Date();
$('dt').textContent=d.toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
$('gr').textContent=(h<12?'Good morning':h<17?'Good afternoon':'Good evening')+', Robney.';
const sm=sum(inM(db.sales,mo()),'amount'),ex=sum(inM(db.expenses,mo()),'amount'),net=sm-ex;
$('st').innerHTML=[['Livestock',db.animals.length,'Animals recorded'],['Eggs today',sum(db.eggs.filter(e=>e.date===td()),'qty'),'Collected today'],['Sales · this month',fmt(sm),'TZS'],['Net · this month',fmt(net),'TZS profit/loss']].map(([l,v,f],i)=>`<div class="card st"><small>${l}</small><div class="num ${i===3?(net>=0?'pos':'neg'):''}">${v}</div><span>${f}</span></div>`).join('');
const ev=[...db.sales.map(x=>({i:'💵',t:'Sold '+x.item,d:x.who||'',a:'+'+fmt(x.amount),c:'pos',dt:x.date,id:x.id})),...db.expenses.map(x=>({i:'🌾',t:x.desc,d:x.cat,a:'−'+fmt(x.amount),c:'neg',dt:x.date,id:x.id})),...db.eggs.map(x=>({i:'🥚',t:'Egg collection',d:x.note||'',a:'+'+x.qty,c:'',dt:x.date,id:x.id})),...db.animals.map(x=>({i:'🐾',t:'Registered '+x.name,d:x.type+' · '+x.breed,a:'+1',c:'',dt:x.created,id:x.id})),...db.crops.map(x=>({i:'🌱',t:x.name,d:x.field+' · '+x.stage,a:'',c:'',dt:x.created,id:x.id}))].sort((a,b)=>(b.dt+b.id).localeCompare(a.dt+a.id)).slice(0,7);
$('act').innerHTML=ev.length?ev.map(e=>`<div class="row"><div class="ic">${e.i}</div><div><strong>${esc(e.t)}</strong><small>${e.dt} ${e.d?'· '+esc(e.d):''}</small></div><b class="${e.c}">${e.a}</b></div>`).join(''):'<div class="empty">🌾 No activity yet. Tap “Add record”.</div>';
const A=db.animals.length,hp=A?Math.round(db.animals.filter(a=>a.health==='Healthy').length/A*100):0,vp=A?Math.round(db.animals.filter(a=>a.vacc==='Vaccinated').length/A*100):0,T2=db.tasks.length,tp=T2?Math.round(db.tasks.filter(t=>t.done).length/T2*100):0;
$('hl').innerHTML=[['Healthy',hp],['Vaccinated',vp],['Tasks done',tp]].map(([l,v])=>`<div class="br"><label>${l}</label><div class="pr"><span style="width:${v}%"></span></div><b>${v}%</b></div>`).join('');
const op=db.tasks.filter(t=>!t.done).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')).slice(0,4);
$('up').innerHTML=op.length?op.map(t=>`<div class="row"><div><strong>${esc(t.title)}</strong><small>${t.due?'Due '+t.due:'No date'}</small></div></div>`).join(''):'<div class="empty">All caught up ✓</div>'}
function renderLive(){const q=$('q').value.toLowerCase(),f=$('fl').value;
const L=db.animals.filter(a=>(a.name+' '+a.breed).toLowerCase().includes(q)&&(f==='all'||a.type===f));
const H=['Healthy','Observation','Sick'];
$('s-a').innerHTML=S([['Total',db.animals.length],['Healthy',db.animals.filter(a=>a.health==='Healthy').length],['Observation / sick',db.animals.filter(a=>a.health!=='Healthy').length],['Vaccinated',db.animals.filter(a=>a.vacc==='Vaccinated').length]]);
$('t-a').innerHTML=T(['Animal','Breed','Sex','Age','Health','Vaccination',''],L.map(a=>[`<strong>${esc(a.name)}</strong><br><small style="color:var(--muted)">${a.type}</small>`,esc(a.breed),a.sex,esc(a.age),sel('animals',a.id,'health',a.health,H),sel('animals',a.id,'vacc',a.vacc,['Vaccinated','Not vaccinated']),X('animals',a.id)]),'🐔 No animals found.');
const E=[...db.eggs].sort((a,b)=>b.date.localeCompare(a.date));
$('t-e').innerHTML=T(['Date','Eggs','Note',''],E.slice(0,30).map(e=>[e.date,e.qty,esc(e.note),X('eggs',e.id)]),'🥚 No eggs recorded yet.')}
function other(){
$('s-c').innerHTML=S([['Plots',db.crops.length],['Growing',db.crops.filter(c=>['Planted','Growing'].includes(c.stage)).length],['Harvested',db.crops.filter(c=>c.stage==='Harvested').length],['Total acres',sum(db.crops,'area')]]);
$('t-c').innerHTML=T(['Crop','Field','Acres','Planted','Harvest','Stage',''],db.crops.map(c=>[`<strong>${esc(c.name)}</strong>`,esc(c.field),c.area||'–',c.planted,c.harvest||'–',sel('crops',c.id,'stage',c.stage,['Planned','Planted','Growing','Harvested']),X('crops',c.id)]),'🌱 No crops yet.');
const s=[...db.sales].sort((a,b)=>b.date.localeCompare(a.date));
$('s-s').innerHTML=S([['This month',fmt(sum(inM(db.sales,mo()),'amount'))],['All time',fmt(sum(db.sales,'amount'))],['Sales count',db.sales.length],['Today',fmt(sum(db.sales.filter(x=>x.date===td()),'amount'))]]);
$('t-s').innerHTML=T(['Date','Item','Qty','Customer','Amount (TZS)',''],s.map(x=>[x.date,esc(x.item),x.qty,esc(x.who)||'–',`<b class="pos">${fmt(x.amount)}</b>`,X('sales',x.id)]),'💵 No sales yet.');
const e=[...db.expenses].sort((a,b)=>b.date.localeCompare(a.date)),m=inM(db.expenses,mo()),cat={};m.forEach(x=>cat[x.cat]=(cat[x.cat]||0)+x.amount);const tc=Object.entries(cat).sort((a,b)=>b[1]-a[1])[0];
$('s-x').innerHTML=S([['This month',fmt(sum(m,'amount'))],['All time',fmt(sum(db.expenses,'amount'))],['Top category',tc?tc[0]:'–'],['Entries',db.expenses.length]]);
$('t-x').innerHTML=T(['Date','Category','Description','Amount (TZS)',''],e.map(x=>[x.date,x.cat,esc(x.desc),`<b class="neg">${fmt(x.amount)}</b>`,X('expenses',x.id)]),
