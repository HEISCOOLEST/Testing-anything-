<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Safari GPS — Tanzania & World</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body,#app,#map{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}
#app{position:relative;background:#eef3f7}.top{position:absolute;z-index:1000;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.brand,.status,.card,.hint,.stat{background:#fff;border-radius:16px;box-shadow:0 4px 18px #0002}
.brand{padding:10px 14px;font-weight:800;pointer-events:auto}.brand small{display:block;font-size:10px;color:#667085;font-weight:500}
.status{padding:8px 11px;font-size:12px}.ok{color:#087443}.bad{color:#b42318}
.panel{position:absolute;z-index:1000;top:78px;left:12px;width:min(430px,calc(100% - 24px))}
.card{padding:10px}.search{display:flex;gap:7px}.search input{min-width:0;flex:1;border:1px solid #d0d5dd;border-radius:11px;padding:11px;font-size:14px}.btn{border:0;border-radius:11px;padding:10px 12px;font-weight:700;background:#1769ff;color:white}.secondary{background:#eef4ff;color:#175cd3}.quick{display:flex;gap:6px;overflow:auto;margin-top:8px}.quick button{white-space:nowrap;border:1px solid #e4e7ec;background:#fff;border-radius:18px;padding:7px 10px;font-size:11px}
.bottom{position:absolute;z-index:1000;bottom:12px;left:12px;right:12px;max-width:520px;margin:auto;display:grid;gap:7px}.hint{padding:10px 12px;background:#172033;color:#fff;font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{padding:9px}.stat b{display:block;font-size:14px}.stat span{font-size:10px;color:#667085}.actions{display:flex;gap:7px}.actions button{flex:1}.leaflet-control-attribution{font-size:9px!important}
@media(min-width:700px){.bottom{left:auto;right:16px;margin:0}}
</style>
</head>
<body>
<div id="app">
<div id="map"></div>
<div class="top">
  <div class="brand">🧭 Safari GPS<small>Tanzania • World Navigator</small></div>
  <div id="net" class="status">Checking…</div>
</div>
<div class="panel">
 <div class="card">
  <div class="search"><input id="q" placeholder="Search place e.g. Dodoma, Sumbawanga"><button class="btn" onclick="searchPlace()">🔎</button></div>
  <div class="quick">
   <button onclick="go(-6.16,35.75,6)">🇹🇿 Tanzania</button>
   <button onclick="go(-6.79,39.21,12)">📍 Dar</button>
   <button onclick="go(-6.17,35.74,13)">🏛️ Dodoma</button>
   <button onclick="go(-7.97,31.62,12)">🌄 Sumbawanga</button>
   <button onclick="go(0,20,3)">🌍 World</button>
  </div>
 </div>
</div>
<div class="bottom">
 <div id="hint" class="hint">💡 <b>Tip:</b> Tap <b>My location</b>, allow location permission, then wait for the GPS accuracy to improve.</div>
 <div class="stats">
  <div class="stat"><b id="coords">—</b><span>Coordinates</span></div>
  <div class="stat"><b id="acc">—</b><span>Accuracy</span></div>
  <div class="stat"><b id="speed">—</b><span>Speed</span></div>
  <div class="stat"><b id="head">—</b><span>Direction</span></div>
 </div>
 <div class="actions">
  <button class="btn" onclick="locate()">📍 My location</button>
  <button id="follow" class="btn secondary" onclick="toggleFollow()">🧭 Follow OFF</button>
  <button class="btn secondary" onclick="hint()">💡 Hint</button>
 </div>
</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([-6.16,35.75],6);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let watch=null,me=null,accuracyCircle=null,follow=false,last=null;
const hints=[
'🧭 Keep the phone reasonably level when using direction information.',
'📍 A smaller accuracy value in metres means a more precise GPS position.',
'🌤️ GPS can work without mobile data, but online map tiles/search need a connection unless suitable map data has been stored locally.',
'🔋 Continuous GPS can use more battery; carry a power bank for long trips.',
'🚗 Never operate the phone while driving. Set up navigation before moving.',
'🔎 Search works when online; GPS positioning can still work when offline.'
];
function network(){let n=document.getElementById('net');n.textContent=navigator.onLine?'● Online':'● Offline';n.className='status '+(navigator.onLine?'ok':'bad')}
addEventListener('online',network);addEventListener('offline',network);network();
function go(lat,lon,z){map.setView([lat,lon],z)}
function locate(){
 if(!navigator.geolocation){document.getElementById('hint').textContent='⚠️ This browser does not support GPS.';return}
 if(watch!==null)return;
 watch=navigator.geolocation.watchPosition(pos=>{
  const c=pos.coords, ll=[c.latitude,c.longitude]; last=pos;
  if(!me)me=L.circleMarker(ll,{radius:8,weight:3,fillOpacity:.9}).addTo(map).bindPopup('📍 You are here');
  else me.setLatLng(ll);
  if(!accuracyCircle)accuracyCircle=L.circle(ll,{radius:c.accuracy,weight:1,fillOpacity:.08}).addTo(map);
  else accuracyCircle.setLatLng(ll).setRadius(c.accuracy);
  document.getElementById('coords').textContent=c.latitude.toFixed(6)+', '+c.longitude.toFixed(6);
  document.getElementById('acc').textContent=Math.round(c.accuracy)+' m';
  document.getElementById('speed').textContent=c.speed==null?'—':(c.speed*3.6).toFixed(1)+' km/h';
  document.getElementById('head').textContent=c.heading==null?'—':dir(c.heading)+' '+Math.round(c.heading)+'°';
  if(follow)map.setView(ll,Math.max(15,map.getZoom()));
  document.getElementById('hint').innerHTML='📍 <b>GPS active:</b> Your position is marked on the map.';
 },e=>{
  const m={1:'Location permission was denied.',2:'Location could not be determined.',3:'GPS timed out.'};
  document.getElementById('hint').textContent='⚠️ '+(m[e.code]||'GPS error')+' Try again.';
 },{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
}
function toggleFollow(){follow=!follow;document.getElementById('follow').textContent='🧭 Follow '+(follow?'ON':'OFF');if(follow&&last)map.setView([last.coords.latitude,last.coords.longitude],15)}
function dir(x){return ['N','NE','E','SE','S','SW','W','NW'][Math.round(x/45)%8]}
function hint(){document.getElementById('hint').innerHTML=hints[Math.floor(Math.random()*hints.length)]}
async function searchPlace(){
 const q=document.getElementById('q').value.trim();if(!q)return;
 if(!navigator.onLine){document.getElementById('hint').textContent='⚠️ Search needs internet. GPS itself can work without mobile data.';return}
 try{
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));
  const d=await r.json();
  if(!d.length){document.getElementById('hint').textContent='❌ Place not found.';return}
  const lat=+d[0].lat,lon=+d[0].lon;map.setView([lat,lon],14);
  L.marker([lat,lon]).addTo(map).bindPopup(d[0].display_name).openPopup();
  document.getElementById('hint').innerHTML='📌 <b>Found:</b> '+d[0].display_name;
 }catch(e){document.getElementById('hint').textContent='⚠️ Search failed. Check your connection.'}
}
setInterval(hint,15000);
</script>
</body>
</html>
